<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monodoro</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf7; --ink:#1c1a15; --mut:#6e6858;
    --line:#dcd4c0; --accent:#3f7d4e; --break:#2f6f95; --warn:#b8860b;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#141310; --card:#1e1c16; --ink:#f0e9d6; --mut:#a49c86;
      --line:#3a3527; --accent:#6dbb7f; --break:#6fb3d9; --warn:#e0b04a;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100svh; display:grid; place-items:center; padding:24px;
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    transition:background .4s ease;
  }
  body.is-break{--accent:var(--break)}
  main{width:100%; max-width:400px; text-align:center}
  h1{
    margin:0 0 30px; font-size:.78rem; font-weight:600;
    letter-spacing:.18em; text-transform:uppercase; color:var(--mut);
  }
  .greeting{margin:-16px 0 22px; font-size:.95rem; font-weight:600}
  .greeting[hidden]{display:none}
  .badge{
    display:inline-block; margin:-20px 0 20px; padding:4px 11px; border-radius:999px;
    font-size:.66rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    background:var(--warn); color:#fff;
  }
  .badge[hidden]{display:none}
  .dial{position:relative; width:260px; height:260px; margin:0 auto 30px}
  .dial svg{width:100%; height:100%; transform:rotate(-90deg)}
  .track{fill:none; stroke:var(--line); stroke-width:10}
  .prog{
    fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round;
    transition:stroke .4s ease;
  }
  .readout{position:absolute; inset:0; display:grid; place-content:center; gap:6px}
  #time{
    font-size:3.6rem; font-weight:700; line-height:1;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em;
  }
  #mode{font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--mut)}
  .controls{display:flex; gap:10px; justify-content:center}
  button{
    font:inherit; font-weight:600; cursor:pointer; min-width:114px; padding:12px 20px;
    border:1px solid var(--line); border-radius:10px;
    background:var(--card); color:var(--ink);
    transition:transform .08s ease;
  }
  button:active{transform:scale(.97)}
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  #go{background:var(--accent); border-color:var(--accent); color:var(--bg)}

  .settings{margin-top:24px}
  .settings-toggle{
    width:100%; min-width:0; padding:11px 16px; font-size:.82rem;
    background:transparent; border-style:dashed;
  }
  .settings-panel{
    margin-top:12px; padding:18px 16px; text-align:left;
    border:1px solid var(--line); border-radius:10px; background:var(--card);
  }
  .settings-panel[hidden]{display:none}
  .field{display:block; margin-bottom:18px}
  .field:last-of-type{margin-bottom:0}
  .field-label{
    display:block; margin-bottom:7px; font-size:.66rem; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; color:var(--mut);
  }
  .field input{
    width:100%; padding:9px 11px; font:inherit; border-radius:8px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
  }
  .field input:focus-visible{outline:3px solid var(--accent); outline-offset:1px}
  .field input:disabled{opacity:.45; cursor:not-allowed}
  .sound-row{display:flex; gap:6px; flex-wrap:wrap}
  .sound-row button{min-width:0; flex:1 1 62px; padding:9px 6px; font-size:.76rem}
  .sound-row button[aria-pressed="true"]{
    background:var(--accent); border-color:var(--accent); color:var(--bg);
  }
  .hint{margin:9px 0 0; font-size:.7rem; color:var(--mut)}

  .stats{
    margin-top:26px; padding-top:18px; border-top:1px solid var(--line);
    font-size:.8rem; color:var(--mut); line-height:1.7;
  }
  .stats b{color:var(--ink)}
  .notice{
    margin:14px 0 0; padding:9px 12px; border-radius:8px;
    border:1px solid var(--warn); color:var(--warn);
    font-size:.72rem; line-height:1.35;
  }
  .notice[hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1>Monodoro</h1>
  <p class="badge" id="badge" hidden>test mode</p>
  <p class="greeting" id="greeting" hidden></p>

  <div class="dial">
    <svg viewBox="0 0 260 260" aria-hidden="true">
      <circle class="track" cx="130" cy="130" r="120"></circle>
      <circle class="prog" id="ring" cx="130" cy="130" r="120"></circle>
    </svg>
    <div class="readout">
      <div id="time">25:00</div>
      <div id="mode">Focus</div>
    </div>
  </div>

  <div class="controls">
    <button id="go">Start</button>
    <button id="reset">Reset</button>
  </div>

  <section class="settings">
    <button type="button" class="settings-toggle" id="settingsToggle"
            aria-expanded="false" aria-controls="settingsPanel">Customize</button>

    <div class="settings-panel" id="settingsPanel" hidden>
      <label class="field">
        <span class="field-label">Focus (minutes)</span>
        <input type="number" id="focusInput" min="1" max="180" step="1" inputmode="numeric">
      </label>

      <label class="field">
        <span class="field-label">Break (minutes)</span>
        <input type="number" id="breakInput" min="1" max="60" step="1" inputmode="numeric">
      </label>

      <div class="field">
        <span class="field-label">Alert sound</span>
        <div class="sound-row" id="soundRow">
          <button type="button" data-sound="classic">Classic</button>
          <button type="button" data-sound="chiptune">Chiptune</button>
          <button type="button" data-sound="blip">Blip</button>
          <button type="button" data-sound="bell">Bell</button>
        </div>
      </div>

      <label class="field">
        <span class="field-label">Your name</span>
        <input type="text" id="nameInput" maxlength="24" placeholder="optional">
      </label>

      <p class="hint" id="testHint" hidden>
        Test mode: durations come from the address bar.
      </p>
    </div>
  </section>

  <div class="stats">
    <div>Today: <b id="todaySessions">0</b> sessions &middot; <b id="todayMinutes">0</b> min</div>
    <div>All time: <b id="count">0</b> sessions</div>
  </div>

  <p class="notice" id="notice" hidden></p>
</main>

<script>
  /* ---------- configuration ---------- */

  const params = new URLSearchParams(location.search);
  const SOUND_KEYS = ["classic", "chiptune", "blip", "bell"];

  const DEFAULTS = {
    focusSec: 25 * 60,
    breakSec: 5 * 60,
    sound: "chiptune",
    name: ""
  };

  const LIMITS = {
    focus: { min: 60, max: 180 * 60 },
    break: { min: 60, max: 60 * 60 }
  };

  const RING_LENGTH = 2 * Math.PI * 120;
  const AUTO_START_DELAY = 1500;

  // URL parameters exist only for testing. They override settings for this
  // page load and are never written to storage.
  const urlFocus = Number(params.get("focusSec"));
  const urlBreak = Number(params.get("breakSec"));
  const TEST_MODE = (urlFocus > 0) || (urlBreak > 0);

  /* ---------- helpers ---------- */

  // Local date, NOT toISOString(): that returns UTC, which files an 11pm
  // session under the next day for anyone east of Greenwich.
  function dateKey(date) {
    const d = date || new Date();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + month + "-" + day;
  }

  // Rounds to whole minutes, but never shows "0 min" for real work.
  function formatMinutes(seconds) {
    if (!(seconds > 0)) return "0";
    const minutes = Math.round(seconds / 60);
    return minutes < 1 ? "<1" : String(minutes);
  }

  function clampInt(value, min, max, fallback) {
    const n = Math.round(Number(value));
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  /* ---------- storage ---------- */

  // Storage is not guaranteed. Private windows block it, and some browsers
  // treat file:// pages as an opaque origin, where localStorage throws.
  // Everything falls back to memory so the app still runs - it just forgets
  // on refresh instead of crashing.
  const store = (function () {
    let backing = null;
    try {
      const probe = "__monodoro_probe__";
      window.localStorage.setItem(probe, "1");
      window.localStorage.removeItem(probe);
      backing = window.localStorage;
    } catch (err) {
      backing = null;
    }

    const memory = {};

    return {
      available: function () {
        return backing !== null;
      },
      get: function (key) {
        if (backing) {
          try {
            return backing.getItem(key);
          } catch (err) {
            // fall through to the memory copy
          }
        }
        return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
      },
      set: function (key, value) {
        memory[key] = value;
        if (!backing) return;
        try {
          backing.setItem(key, value);
        } catch (err) {
          // Quota exceeded or storage blocked mid-session - keep going.
        }
      }
    };
  })();

  const STORE_SETTINGS = "monodoro.settings";
  const STORE_SOUND_LEGACY = "monodoro.sound";
  const STORE_COMPLETED = "monodoro.completed";
  const STORE_DAYS = "monodoro.days";

  function loadCount() {
    const value = Number(store.get(STORE_COMPLETED));
    return Number.isFinite(value) && value >= 0 ? value : 0;
  }

  // Settings may be missing, corrupt, hand-edited, or written by an older
  // version. Every field is validated individually so one bad value cannot
  // take out the rest.
  function loadSettings() {
    let parsed = null;
    try {
      parsed = JSON.parse(store.get(STORE_SETTINGS) || "null");
    } catch (err) {
      parsed = null;
    }
    const raw = (parsed && typeof parsed === "object" && !Array.isArray(parsed))
      ? parsed
      : {};

    // Migration: the sound used to live under its own key.
    const legacySound = store.get(STORE_SOUND_LEGACY);
    const sound = SOUND_KEYS.indexOf(raw.sound) >= 0
      ? raw.sound
      : (SOUND_KEYS.indexOf(legacySound) >= 0 ? legacySound : DEFAULTS.sound);

    return {
      focusSec: clampInt(
        raw.focusSec, LIMITS.focus.min, LIMITS.focus.max, DEFAULTS.focusSec
      ),
      breakSec: clampInt(
        raw.breakSec, LIMITS.break.min, LIMITS.break.max, DEFAULTS.breakSec
      ),
      sound: sound,
      name: typeof raw.name === "string" ? raw.name.slice(0, 24) : DEFAULTS.name
    };
  }

  // Never trust stored JSON - anything unexpected becomes an empty history
  // rather than a broken page.
  function loadDays() {
    const stored = store.get(STORE_DAYS);
    if (!stored) return {};
    try {
      const parsed = JSON.parse(stored);
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
      return parsed;
    } catch (err) {
      return {};
    }
  }

  /* ---------- state ---------- */

  const settings = loadSettings();

  if (urlFocus > 0) settings.focusSec = Math.round(urlFocus);
  if (urlBreak > 0) settings.breakSec = Math.round(urlBreak);

  function saveSettings() {
    store.set(STORE_SETTINGS, JSON.stringify(settings));
  }

  let mode = "focus";
  let total = settings.focusSec;
  let left = settings.focusSec;
  let running = false;
  let timerId = null;
  let endAt = 0;
  let autoId = null;
  let completed = loadCount();
  let days = loadDays();
  let audioCtx = null;
  let selectedSound = settings.sound;

  const el = {
    time: document.getElementById("time"),
    mode: document.getElementById("mode"),
    ring: document.getElementById("ring"),
    go: document.getElementById("go"),
    reset: document.getElementById("reset"),
    count: document.getElementById("count"),
    badge: document.getElementById("badge"),
    notice: document.getElementById("notice"),
    greeting: document.getElementById("greeting"),
    todaySessions: document.getElementById("todaySessions"),
    todayMinutes: document.getElementById("todayMinutes"),
    settingsToggle: document.getElementById("settingsToggle"),
    settingsPanel: document.getElementById("settingsPanel"),
    focusInput: document.getElementById("focusInput"),
    breakInput: document.getElementById("breakInput"),
    nameInput: document.getElementById("nameInput"),
    testHint: document.getElementById("testHint")
  };

  el.ring.style.strokeDasharray = RING_LENGTH;
  el.badge.hidden = !TEST_MODE;

  function format(seconds) {
    const m = String(Math.floor(seconds / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");
    return m + ":" + s;
  }

  function render() {
    const text = format(left);
    el.time.textContent = text;
    el.mode.textContent = mode === "focus" ? "Focus" : "Break";
    el.go.textContent = running ? "Pause" : "Start";
    el.ring.style.strokeDashoffset = RING_LENGTH * (1 - left / total);
    document.body.classList.toggle("is-break", mode === "break");
    document.title = (running ? text + " - " : "") + "Monodoro";
  }

  function renderGreeting() {
    const name = settings.name.trim();
    el.greeting.textContent = name ? "Hey, " + name : "";
    el.greeting.hidden = !name;
  }

  function todayEntry() {
    const entry = days[dateKey()];
    if (entry && typeof entry === "object") {
      return {
        sessions: Number(entry.sessions) || 0,
        seconds: Number(entry.seconds) || 0
      };
    }
    return { sessions: 0, seconds: 0 };
  }

  function renderStats() {
    const today = todayEntry();
    el.todaySessions.textContent = today.sessions;
    el.todayMinutes.textContent = formatMinutes(today.seconds);
    el.count.textContent = completed;
  }

  function recordFocusSession(seconds) {
    const key = dateKey();
    const entry = todayEntry();
    entry.sessions += 1;
    entry.seconds += seconds;
    days[key] = entry;
    store.set(STORE_DAYS, JSON.stringify(days));
  }

  /* ---------- audio ---------- */

  // Browsers block audio until the user interacts with the page, so the
  // context is created and resumed on the first click rather than at chime
  // time - otherwise the sound is silently blocked.
  function ensureAudio() {
    try {
      if (!audioCtx) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return;
        audioCtx = new AudioCtor();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (err) {
      audioCtx = null;
    }
  }

  // One synthesised note. All sounds are built from these, so the app needs
  // no audio files and still works offline.
  function tone(freq, startAt, duration, type, peak) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.exponentialRampToValueAtTime(peak, startAt + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startAt);
    osc.stop(startAt + duration + 0.05);
  }

  const SOUNDS = {
    // Warm two-note chime with a low note underneath for body.
    classic: function (now) {
      tone(880, now, 0.5, "sine", 0.32);
      tone(1318.5, now + 0.16, 0.5, "sine", 0.3);
      tone(220, now, 0.55, "sine", 0.2);
    },
    // Rising square-wave arpeggio. Retro console flavour, original notes.
    chiptune: function (now) {
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      notes.forEach(function (freq, index) {
        tone(freq, now + index * 0.075, 0.2, "square", 0.15);
      });
    },
    // Short high blip, then a longer one.
    blip: function (now) {
      tone(988, now, 0.08, "square", 0.26);
      tone(1319, now + 0.085, 0.34, "square", 0.24);
    },
    // Soft bell with a long tail and a shimmer on top.
    bell: function (now) {
      tone(1046.5, now, 1.6, "sine", 0.34);
      tone(1568, now + 0.02, 1.1, "sine", 0.13);
      tone(2093, now + 0.04, 0.7, "sine", 0.07);
    }
  };

  function playSound(key) {
    const sound = SOUNDS[key];
    if (!audioCtx || !sound) return;
    try {
      sound(audioCtx.currentTime);
    } catch (err) {
      // Audio is a nicety - never let it break the timer.
    }
  }

  /* ---------- timer ---------- */

  // A pending auto-start must be cancellable, otherwise pressing Reset
  // leaves a timer running that starts a session behind your back.
  function cancelAuto() {
    if (autoId !== null) {
      clearTimeout(autoId);
      autoId = null;
    }
  }

  // Recompute the remaining time from the clock instead of counting ticks,
  // so the countdown cannot drift even when the interval fires late.
  function tick() {
    const remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    if (remaining === left) return;
    left = remaining;
    render();
    if (left === 0) finish();
  }

  function finish() {
    stop();
    playSound(selectedSound);

    if (mode === "focus") {
      completed += 1;
      store.set(STORE_COMPLETED, String(completed));
      recordFocusSession(settings.focusSec);
      renderStats();
      mode = "break";
      total = settings.breakSec;
    } else {
      mode = "focus";
      total = settings.focusSec;
    }

    left = total;
    render();
    autoId = setTimeout(function () {
      autoId = null;
      start();
    }, AUTO_START_DELAY);
  }

  function start() {
    cancelAuto();
    if (running) return;
    ensureAudio();
    running = true;
    endAt = Date.now() + left * 1000;
    timerId = setInterval(tick, 250);
    render();
  }

  function stop() {
    running = false;
    clearInterval(timerId);
    timerId = null;
    render();
  }

  function toggle() {
    running ? stop() : start();
  }

  function reset() {
    cancelAuto();
    stop();
    mode = "focus";
    total = settings.focusSec;
    left = settings.focusSec;
    render();
  }

  /* ---------- sound picker ---------- */

  const soundButtons = Array.prototype.slice.call(
    document.querySelectorAll("[data-sound]")
  );

  function renderSoundChoice() {
    soundButtons.forEach(function (btn) {
      btn.setAttribute(
        "aria-pressed",
        String(btn.dataset.sound === selectedSound)
      );
    });
  }

  soundButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      selectedSound = btn.dataset.sound;
      settings.sound = selectedSound;
      saveSettings();
      ensureAudio();
      playSound(selectedSound);
      renderSoundChoice();
    });
  });

  /* ---------- settings panel ---------- */

  function syncDurationInputs() {
    el.focusInput.value = settings.focusSec >= 60
      ? Math.round(settings.focusSec / 60) : "";
    el.breakInput.value = settings.breakSec >= 60
      ? Math.round(settings.breakSec / 60) : "";
  }

  // Changing a duration while the clock is stopped should take effect
  // immediately. Mid-session changes wait for the next session, because
  // rewriting a running countdown underneath the user is disorienting.
  function applyDurations() {
    settings.focusSec = clampInt(
      el.focusInput.value, 1, 180, settings.focusSec / 60
    ) * 60;
    settings.breakSec = clampInt(
      el.breakInput.value, 1, 60, settings.breakSec / 60
    ) * 60;
    saveSettings();
    syncDurationInputs();

    if (!running) {
      cancelAuto();
      total = mode === "focus" ? settings.focusSec : settings.breakSec;
      left = total;
      render();
    }
  }

  el.focusInput.addEventListener("change", applyDurations);
  el.breakInput.addEventListener("change", applyDurations);

  el.nameInput.addEventListener("input", function () {
    settings.name = el.nameInput.value.slice(0, 24);
    saveSettings();
    renderGreeting();
  });

  el.settingsToggle.addEventListener("click", function () {
    const willOpen = el.settingsPanel.hidden;
    el.settingsPanel.hidden = !willOpen;
    el.settingsToggle.setAttribute("aria-expanded", String(willOpen));
    el.settingsToggle.textContent = willOpen ? "Hide settings" : "Customize";
  });

  el.go.addEventListener("click", toggle);
  el.reset.addEventListener("click", reset);

  /* ---------- init ---------- */

  if (TEST_MODE) {
    el.focusInput.disabled = true;
    el.breakInput.disabled = true;
    el.testHint.hidden = false;
  }

  syncDurationInputs();
  el.nameInput.value = settings.name;
  renderSoundChoice();
  renderGreeting();
  renderStats();
  render();

  // Tell the user up front when saving is impossible, rather than letting
  // them discover it by losing a session.
  if (!store.available()) {
    el.notice.textContent =
      "Heads up: this browser is blocking local storage, so your session " +
      "count and settings will reset when the page reloads. Opening the " +
      "app from a web address instead of a file fixes this.";
    el.notice.hidden = false;
    console.warn(
      "Monodoro: persistent storage is unavailable here, so progress will " +
      "reset when the page reloads."
    );
  }
</script>
</body>
</html>
